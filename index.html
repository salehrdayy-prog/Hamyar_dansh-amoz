<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <title>همیار دانش‌آموز</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- هدر -->
  <header class="app-header">
    <h1>📚 همیار دانش‌آموز</h1>
    <p class="subtitle">یادگیری راحت، سریع، آفلاین</p>
  </header>

  <!-- خوش‌آمدگویی -->
  <div class="welcome-card">
    <span class="welcome-icon">👋</span>
    <div class="welcome-text">
      <strong>خوش آمدی!</strong>
      <span>پایه تحصیلی خودت رو انتخاب کن</span>
    </div>
  </div>

  <!-- کارت‌های پایه -->
  <main class="main-content">
    <h2 class="section-title">🎓 پایه تحصیلی</h2>

    <div class="grades-grid">

      <!-- هفتم -->
      <a href="haftom/index.html" class="grade-card" data-grade="haftom">
        <div class="grade-icon">📕</div>
        <div class="grade-info">
          <h3>پایه هفتم</h3>
          <p>۵ درس آماده یادگیری</p>
        </div>
        <div class="grade-arrow">←</div>
      </a>

      <!-- هشتم -->
      <a href="hashtom/index.html" class="grade-card" data-grade="hashtom">
        <div class="grade-icon">📗</div>
        <div class="grade-info">
          <h3>پایه هشتم</h3>
          <p>۵ درس آماده یادگیری</p>
        </div>
        <div class="grade-arrow">←</div>
      </a>

      <!-- نهم -->
      <a href="nohom/index.html" class="grade-card" data-grade="nohom">
        <div class="grade-icon">📘</div>
        <div class="grade-info">
          <h3>پایه نهم</h3>
          <p>۵ درس آماده یادگیری</p>
        </div>
        <div class="grade-arrow">←</div>
      </a>

    </div>
  </main>

  <!-- فوتر -->
  <footer class="app-footer">
    <p>ساخته شده با ❤️ برای دانش‌آموزان</p>
    <p class="version">نسخه ۱.۰.۰</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
